  frequencies_hz: [250.0, 500.0, 1000.0, 2000.0, 4000.0]
  absorption:
    x: [0.25, 0.30, 0.35, 0.40, 0.45]
    y: [0.20, 0.25, 0.30, 0.35, 0.40]
    z: [0.15, 0.18, 0.22, 0.28, 0.32]
