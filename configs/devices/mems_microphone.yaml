# Device preset: MEMS microphone (RX). PLAN §2.1: "MEMS microphones typically
# stop near 16 kHz". Values are models, not measurements (PLAN §5).
name: mems_microphone
kind: microphone

# Non-flat transducer response (dB), aligned element-wise with
# frequency_response_hz. Flat to ~12 kHz, sharp rolloff above ~16 kHz.
frequency_response_hz: [100.0, 200.0, 300.0, 500.0, 1000.0, 2000.0, 4000.0, 8000.0, 10000.0, 12000.0, 14000.0, 16000.0, 18000.0, 20000.0]
frequency_response_db: [-20.0, -6.0, -2.0, 0.0, 0.0, -1.0, -2.0, -4.0, -6.0, -10.0, -18.0, -30.0, -45.0, -60.0]

# Device-limited usable sub-band (PLAN §2.1).
usable_band_hz: [200.0, 16000.0]

# SPL above which AGC / limiter behaviour is engaged (modelling hook).
max_spl_db: 120.0
