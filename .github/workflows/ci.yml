name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (fmt + lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: make check
        run: make check
      - name: make types
        run: make types
